# MoerEngine Config
# C++ side definition in: source/runtime/core/include/config/GlobalConfig.h

[editor]
width = 1920
height = 1080
fullscreen = false
vsync = false

lock_frame_rate = false
fps = 60
max_fps = 170
font_size = 17.0

[engine]

[engine.threading]
render_thread = false
rhi_thread = false
rhi_bypass = true
max_frame_lag = 0
profile_logging = false
parallel_recording = false
parallel_record_workers = 0
parallel_record_verify = false
parallel_record_profile = false
# Backend CPU-recording work units per job; this is not a draw-count threshold.
parallel_record_min_work_units_per_job = 64
# Bounded number of RHI batches allowed to overlap Translate and Submission.
# Runtime clamps this value to the supported range [1, 8].
# If Graphics and Compute alias the same native queue, the effective window is 1.
submission_batch_window = 2

[engine.profile_dump]
enabled = false
output_path = "./profile/MoerProfile.mpd"
# The previous final capture is replaced only after the new capture closes successfully.
replace_existing = true

[engine.rhi]
type = "Vulkan"
api_version = "1.3"

# type = "D3D12"

max_frame_in_flight = 3

[engine.render]
default_render_method = "Raster"
# default_render_method = "Raytracing"

[engine.render.raster]
enable_shadow = true
render_graph = false
render_graph_debug_dump = false
render_graph_parallel_recording = false

# 推荐AMD GPU或低配显卡启用本设置
# 该选项会启用光栅化低质量模式：
# - 环境光遮蔽：RTAO => SSAO
# - 阴影，CSM层级数量：4 => 1
# - 阴影，ShadowMap分辨率：4096 => 2048
# - 抗锯齿：SMAA_1X => FXAA Simplified
low_quality_mode = false

[engine.render.raytracing]
render_graph = false
render_graph_debug_dump = false
render_graph_parallel_recording = false

[engine.scene]
# 注：Toml中使用单引号包裹路径，可以避免反斜杠被识别为转义符
# 注：scene_path支持绝对路径
scene_path = './asset/scenes/sponza/Sponza.gltf'
enable_cache = true # 如果在开发SceneParser等功能，需要每次重新读取场景，那么可以关闭这个选项
material_info_log_lines = 20 # 加载场景时，打印材质信息的最大行数。-1 表示全部打印

[engine.remote]
enable = true
bind_address = "127.0.0.1"
http_port = 18080
websocket_port = 18081
